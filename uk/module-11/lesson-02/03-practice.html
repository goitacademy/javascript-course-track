<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheCatAPI practice</title>
  </head>
  <body>
    <p class="mt-4">
      <a href="index.html" class="btn btn-outline-secondary"> ← Go Back </a>
    </p>

    <div class="container py-5">
      <!-- Форма пошуку -->
      <form id="search-form" class="p-4 bg-white rounded shadow-sm">
        <div class="mb-3">
          <label for="breed-input" class="form-label"
            >Оберіть породу кота:</label
          >
          <input
            list="breeds-list"
            id="breed-input"
            class="form-control"
            placeholder="Наприклад: Bengal"
            autocomplete="off"
          />
          <datalist id="breeds-list"></datalist>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Знайти зображення
        </button>
      </form>

      <!-- Лоадер -->
      <div id="loader" class="text-center mt-4 d-none">
        <p class="text-muted">Завантаження...</p>
      </div>
    </div>

    <!-- Контейнер для картки -->
    <div id="cat-card" class="mt-4"></div>

    <script src="src/js/03-practice.js" type="module"></script>
  </body>
</html>
