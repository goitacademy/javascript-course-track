<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon practice</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/common.css" />
  </head>
  <body>
    <p class="mt-4">
      <a href="index.html" class="btn btn-outline-secondary"> ← Go Back </a>
    </p>

    <form class="form search-form p-3 bg-light rounded shadow">
      <div class="form-group mb-3">
        <label for="searchQuery" class="form-label fw-bold"
          >Пошук Покемона</label
        >
        <input
          type="text"
          class="form-control"
          id="searchQuery"
          name="query"
          placeholder="Введіть ім'я покемона..."
        />
        <small class="form-text text-muted"
          >Наприклад: Ditto, Bulbasaur, Charmeleon, Psyduck, Persian</small
        >
      </div>
      <button type="submit" class="btn btn-primary w-100">Search</button>
    </form>

    <div class="card-container mt-4"></div>

    <script src="js/03-practice.js"></script>
  </body>
</html>
